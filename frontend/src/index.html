<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B9D',
            secondary: '#FFD93D',
            background: '#FFF0F5',
            warm: '#8B4067',
            accent: '#FF8E53',
            purple: '#C77DFF',
            gold: '#FFD700'
          },
          fontFamily: {
            title: ['Pacifico', 'cursive'],
            subtitle: ['Comfortaa', 'cursive'],
            body: ['Nunito', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-background font-body text-warm min-h-screen overflow-hidden">
  <div id="confetti-container" class="fixed inset-0 pointer-events-none z-50"></div>
  <div id="floating-hearts" class="fixed inset-0 pointer-events-none z-0"></div>
  <div id="sparkle-container" class="fixed inset-0 pointer-events-none z-40"></div>
  <div id="floating-emojis" class="fixed inset-0 pointer-events-none z-30"></div>
  <div id="floating-photos" class="fixed inset-0 pointer-events-none z-20"></div>
  <div id="clickable-emojis" class="fixed inset-0 z-10"></div>

  <main id="main-container" class="relative z-15 min-h-screen flex flex-col items-center justify-center p-4 pointer-events-none">
    <div class="relative mb-4 pointer-events-auto">
      <h1 id="lorette-title" class="font-title text-[5rem] md:text-[9rem] lg:text-[13rem] font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary via-purple to-accent animate-gradient cursor-pointer select-none leading-none animate-float-slow" style="text-shadow: 0 0 80px rgba(255,107,157,0.6);">
        Lorette
      </h1>
    </div>
    <p class="font-subtitle text-2xl md:text-4xl text-warm/80 mb-2 pointer-events-auto cursor-pointer hover:scale-110 transition-transform animate-wiggle-infinite" id="birthday-text">
      Joyeux Anniversaire
    </p>
    <div class="text-xl md:text-2xl text-warm/60 pointer-events-auto animate-bounce-slow" id="date-text">
      6 Decembre
    </div>
    <div id="counter-box" class="fixed bottom-2 right-2 opacity-5 hover:opacity-100 transition-opacity duration-500 cursor-pointer z-50 pointer-events-auto">
      <div class="bg-white/30 backdrop-blur-sm rounded-full px-3 py-1 shadow-sm">
        <span id="click-counter" class="text-xs font-bold text-primary/50">0</span>
      </div>
    </div>
  </main>

  <div id="photo-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="relative max-w-2xl w-full">
      <img id="modal-photo" src="" alt="" class="w-full rounded-3xl shadow-2xl animate-photo-pop">
      <button id="close-photo-modal" class="absolute -top-4 -right-4 w-12 h-12 bg-primary text-white rounded-full text-2xl hover:bg-purple transition-colors shadow-lg">x</button>
    </div>
  </div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
