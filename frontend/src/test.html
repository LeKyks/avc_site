<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Liste Raclette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FFA726',
            secondary: '#FFD54F',
            background: '#FFF8E1',
            warm: '#5D4037',
            accent: '#FF7043'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background p-8">
  <h1 class="text-4xl font-bold text-primary mb-4">Test Raclette</h1>
  <div id="result" class="bg-white p-4 rounded shadow"></div>
  
  <script type="module">
    console.log('Script loaded!');
    const API_URL = 'http://localhost:3000';
    
    async function testAPI() {
      try {
        console.log('Fetching from:', `${API_URL}/api/items`);
        const response = await fetch(`${API_URL}/api/items`);
        console.log('Response:', response);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Data:', data);
        
        document.getElementById('result').innerHTML = `
          <h2 class="text-2xl font-bold mb-2">Items trouvés: ${data.items.length}</h2>
          <pre class="bg-gray-100 p-4 rounded overflow-auto">${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('result').innerHTML = `
          <p class="text-red-600 font-bold">Erreur: ${error.message}</p>
        `;
      }
    }
    
    testAPI();
  </script>
</body>
</html>
